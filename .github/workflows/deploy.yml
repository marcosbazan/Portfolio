name: Deploy Portfolio (Frontend & Backend)

on:
  push:
    branches:
      - master

jobs:
  # -----------------------------------------------------------------
  # TRABAJO 1: DESPLIEGUE DEL BACKEND (LARAVEL EN EC2)
  # -----------------------------------------------------------------
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Comprobar si hubo cambios en backend
        id: check_backend
        run: |
          # Detecta si hubo cambios en tu carpeta Backend
          if git diff --name-only HEAD~1 | grep -q '^Backend/'; then
            echo "cambios=true" >> $GITHUB_OUTPUT
          else
            echo "cambios=false" >> $GITHUB_OUTPUT
          fi

      - name: Ejecutar despliegue en EC2 por SSH
        if: steps.check_backend.outputs.cambios == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            key: ${{ secrets.SSH_KEY }}
            port: 22
            script: |
              cd /var/www/portfolio-backend

              # 1. Desbloquear Git y traer los cambios reales de master
              sudo git config --global --add safe.directory /var/www/portfolio-backend
              sudo git fetch origin master
              sudo git reset --hard origin/master
              sudo git pull origin master

              # 2. Asegurar permisos iniciales para evitar errores de Log "Permission Denied"
              sudo chown -R www-data:www-data /var/www/portfolio-backend
              sudo chmod -R 775 /var/www/portfolio-backend/storage /var/www/portfolio-backend/bootstrap/cache
              sudo chmod -R 775 /var/www/portfolio-backend/Backend/storage /var/www/portfolio-backend/Backend/bootstrap/cache

              # 3. Entramos a la subcarpeta Backend donde Git descarga el código nuevo
              cd Backend

              # 4. Instalar dependencias y regenerar el mapa de clases (Evita el "Target class does not exist")
              composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
              composer dump-autoload

              # 5. Limpiar y re-generar cachés en el Laravel actualizado
              php artisan cache:clear
              php artisan config:clear
              php artisan route:clear

              # 6. Ejecutar migraciones y el Seeder con los iconos nuevos sin preguntas interactivas
              php artisan migrate --force
              php artisan db:seed --class=SkillSeeder --force

              php artisan config:cache
              php artisan route:cache
              php artisan view:cache

              # 7. Permisos finales de seguridad para Nginx en todo el proyecto
              sudo chown -R www-data:www-data /var/www/portfolio-backend
              sudo chmod -R 775 /var/www/portfolio-backend
  # -----------------------------------------------------------------
  # TRABAJO 2: DESPLIEGUE DEL FRONTEND (ANGULAR EN S3 + CLOUDFRONT)
  # -----------------------------------------------------------------
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 💡 Dejamos este paso aquí para que no de error, pero ya NO bloqueará los pasos de abajo
      - name: Comprobar si hubo cambios en Frontend
        id: check_frontend
        run: |
          if git diff --name-only HEAD~1 | grep -q '^Frontend/'; then
            echo "cambios=true" >> $GITHUB_OUTPUT
          else
            echo "cambios=false" >> $GITHUB_OUTPUT
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de Angular (con pnpm)
        run: |
          cd Frontend
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: Compilar Frontend (ng build)
        run: |
          cd Frontend
          pnpm run build

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCES_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Subir archivos limpios a S3
        run: |
          aws s3 sync Frontend/dist/Portfolio s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: Invalidar la caché de CloudFront para ver los cambios ya mismo
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
