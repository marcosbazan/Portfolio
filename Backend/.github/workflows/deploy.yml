name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main  # Cambia esto a master si tu rama principal se llama master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar comandos en la EC2 por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /var/www/portfolio-backend

            # 1. Traer el código nuevo de GitHub de forma limpia
            sudo git reset --hard origin/main
            sudo git pull origin main

            # 2. Instalar dependencias de PHP para producción
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # 3. Limpiar y refrescar la caché de Laravel para que note los cambios al instante
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 4. Ejecutar migraciones por si has tocado o añadido tablas en la Base de Datos
            php artisan migrate --force

            # 5. Asegurar los permisos para que Nginx y PHP no den errores 502
            sudo chown -R www-data:www-data /var/www/portfolio-backend
            sudo chmod -R 775 /var/www/portfolio-backend/storage /var/www/portfolio-backend/bootstrap/cache
